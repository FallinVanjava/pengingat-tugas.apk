name: pengingat_tugas
description: "Aplikasi Pengingat Tugas dengan Alarm"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  table_calendar: ^3.1.2
  shared_preferences: ^2.3.3
